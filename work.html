<span style="font-size: 15px; line-height: 1.6; color: #A89F99">{{ p.desc }}</span>
</div>

<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 0 24px 110px">
<div style="border-radius: 40px; padding: clamp(40px, 6vw, 80px); background: linear-gradient(120deg,#FF4D8D,#FF7A2F 55%,#FFB547); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; box-shadow: 0 40px 120px rgba(255,90,60,.35)">
<h2 style="margin: 0; flex: 999 1 520px; font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(30px, 4.4vw, 62px); line-height: 1.02; letter-spacing: -0.04em; color: #140A08">Наступний кейс може бути вашим.</h2>
<a class="rp-btn" href="contact.html" style="display: inline-flex; align-items: center; min-height: 60px; padding: 0 32px; border-radius: 999px; background: #0D0A0B; color: #FFFFFF; font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase">Почати проєкт</a>
</div>

<div style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 280px"><span class="rp-grad" style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px">RED PANDA</span><span style="font-size: 15px; color: #A89F99; max-width: 320px; line-height: 1.6">Бренд-студія: брендинг, ребрендинг, поліграфія з друком і вебдизайн.</span></div>
<nav aria-label="Меню в підвалі" style="display: flex; flex-direction: column; gap: 10px; font-weight: 600; font-size: 15px"><a href="services.html">Послуги</a><a href="work.html">Роботи</a><a href="pricing.html">Ціни</a><a href="contact.html">Контакти</a></nav>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 15px"><a href="mailto:meet.red.panda@gmail.com" style="font-weight: 800">meet.red.panda@gmail.com</a><a href="#">Instagram</a><a href="#">Behance</a><a href="#">Telegram</a></div>
</div>
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px 32px; font-size: 14px; color: #A89F99">© 2026 Red Panda Design</div>
</footer>
</div>
</template>
<div id="rp-root"></div>
<script>
/* Tiny renderer for the page template: {{holes}}, <sc-for>, <sc-if>, onClick handlers. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  }
  forceUpdate() { if (this.__render) this.__render(); }
}
(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function look(ctx, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = ctx, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function str(ctx, s) {
    return s.replace(HOLE, function (m, p) { var v = look(ctx, p); return v == null ? '' : String(v); });
  }
  function holeOf(s) { var m = (s || '').match(WHOLE); return m ? m[1] : (s || ''); }
  function proc(node, ctx, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(str(ctx, node.nodeValue))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName.toLowerCase();
    if (tag === 'sc-for') {
      var list = look(ctx, holeOf(node.getAttribute('list'))) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (it, i) {
        var c = Object.create(ctx); c[as] = it; c.$index = i;
        node.childNodes.forEach(function (ch) { proc(ch, c, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(ctx, holeOf(node.getAttribute('value')))) node.childNodes.forEach(function (ch) { proc(ch, ctx, out); });
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var m = a.value.match(WHOLE);
      if (/^on/i.test(a.name) && m) {
        var fn = look(ctx, m[1]);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      el.setAttribute(a.name, str(ctx, a.value));
    });
    var kids = [];
    node.childNodes.forEach(function (ch) { proc(ch, ctx, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  window.rpMount = function (C) {
    var tpl = document.getElementById('rp-tpl').content;
    var root = document.getElementById('rp-root');
    var comp = new C({});
    root.addEventListener('submit', function (e) { e.preventDefault(); });
    function render() {
      var saved = {};
      root.querySelectorAll('input[id], textarea[id]').forEach(function (e) { saved[e.id] = e.value; });
      var vals = comp.renderVals() || {};
      var out = [];
      tpl.childNodes.forEach(function (ch) { proc(ch, vals, out); });
      root.replaceChildren.apply(root, out);
      Object.keys(saved).forEach(function (id) { var e = document.getElementById(id); if (e) e.value = saved[id]; });
    }
    comp.__render = render;
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'Усі' };
  }
  renderVals() {
    const all = [
      { name: 'Pesto&Co', title: 'Pesto&Co — айдентика траторії', cat: 'Брендинг', desc: 'Логотип, вивіска, меню, упаковка й серветки для сімейної траторії. Дивитися кейс →', img: 'assets/pesto-sign.jpg', alt: 'Вивіска траторії Pesto&Co на фасаді', href: 'case-pesto.html' },
      { name: 'Nord', title: 'Nord Coffee — бренд і упаковка', cat: 'Брендинг', desc: 'Логотип із драккаром, стаканчики, пакети для зерна, етикетки й вітрина. Дивитися кейс →', img: 'assets/nord-scene.jpg', alt: 'Пакети кави й стаканчик Nord Coffee', href: 'case-nord.html' },
      { name: 'Villa Montallegro', title: 'Villa Montallegro — сайт клініки', cat: 'Веб', desc: 'Навчальний концепт редизайну: італомовний сайт приватної клініки в Генуї із записом на консультацію у два кроки. Дивитися кейс →', img: 'assets/villa-cover.jpg', alt: 'Головна сторінка Villa Montallegro італійською на ноутбуці й телефоні.', href: 'case-villa-montallegro.html' },
      { name: 'Vela', title: 'Vela — бренд лляного одягу', cat: 'Брендинг', desc: 'Айдентика й пакування для італійського бренду лляного одягу. Дивитися кейс →', img: 'assets/vela-box.jpg', alt: 'Лляна сорочка Vela з биркою в сливовій коробці', href: 'case-vela.html' },
      { name: 'Orbit', title: 'Orbit — каталог освітлення', cat: 'Поліграфія', desc: 'Каталог Collection 01 для виробника архітектурного освітлення: обкладинка, розвороти й технічні сторінки. Дивитися кейс →', img: 'assets/orbit-cover.jpg', alt: 'Обкладинка каталогу Orbit Architectural lighting', href: 'case-orbit.html' },
      { name: 'Contivolo', title: 'Contivolo — ребрендинг фінтеху', cat: 'Ребрендинг', desc: 'Новий знак, палітра, інтерфейс застосунку й шаблони для соцмереж сервісу рахунків. Дивитися кейс →', img: 'assets/contivolo-hero.jpg', alt: 'Знак Contivolo на персиковій обкладинці та екран застосунку з рахунками', href: 'case-contivolo.html' }
    ];
    const f = this.state.filter;
    const labels = ['Усі', 'Брендинг', 'Ребрендинг', 'Поліграфія', 'Веб'];
    const chips = labels.map((l) => {
      const active = f === l;
      return {
        label: l,
        count: l === 'Усі' ? all.length : all.filter((p) => p.cat === l).length,
        active: active,
        bg: active ? '#FFFFFF' : 'transparent',
        fg: active ? '#0D0A0B' : '#F5EFEA',
        pick: () => this.setState({ filter: l })
      };
    });
    const projects = (f === 'Усі' ? all : all.filter((p) => p.cat === f)).map((p) => Object.assign({ href: 'contact.html', img: '', alt: '' }, p, { noImg: !p.img }));
    return { chips: chips, projects: projects };
  }
}

rpMount(Component);
</script>
