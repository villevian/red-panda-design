<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #A89F99">Nel segno c’è un drakkar, la nave vichinga, la cui vela è diventata un chicco di caffè. Sotto, un intreccio che si ripete come pattern su bicchieri, etichette e sacchetti. Il carattere graziato aggiunge calore e un tocco artigianale.</p>
