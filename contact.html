<script>
/* Tiny renderer for the page template: {{holes}}, <sc-for>, <sc-if>, onClick handlers. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  }
  forceUpdate() { if (this.__render) this.__render(); }
}
(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function look(ctx, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = ctx, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function str(ctx, s) {
    return s.replace(HOLE, function (m, p) { var v = look(ctx, p); return v == null ? '' : String(v); });
  }
  function holeOf(s) { var m = (s || '').match(WHOLE); return m ? m[1] : (s || ''); }
  function proc(node, ctx, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(str(ctx, node.nodeValue))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName.toLowerCase();
    if (tag === 'sc-for') {
      var list = look(ctx, holeOf(node.getAttribute('list'))) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (it, i) {
        var c = Object.create(ctx); c[as] = it; c.$index = i;
        node.childNodes.forEach(function (ch) { proc(ch, c, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(ctx, holeOf(node.getAttribute('value')))) node.childNodes.forEach(function (ch) { proc(ch, ctx, out); });
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var m = a.value.match(WHOLE);
      if (/^on/i.test(a.name) && m) {
        var fn = look(ctx, m[1]);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      el.setAttribute(a.name, str(ctx, a.value));
    });
    var kids = [];
    node.childNodes.forEach(function (ch) { proc(ch, ctx, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  window.rpMount = function (C) {
    var tpl = document.getElementById('rp-tpl').content;
    var root = document.getElementById('rp-root');
    var comp = new C({});
    root.addEventListener('submit', function (e) { e.preventDefault(); });
    function render() {
      var saved = {};
      root.querySelectorAll('input[id], textarea[id]').forEach(function (e) { saved[e.id] = e.value; });
      var vals = comp.renderVals() || {};
      var out = [];
      tpl.childNodes.forEach(function (ch) { proc(ch, vals, out); });
      root.replaceChildren.apply(root, out);
      Object.keys(saved).forEach(function (id) { var e = document.getElementById(id); if (e) e.value = saved[id]; });
    }
    comp.__render = render;
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['Брендинг', 'Поліграфія і друк'], budget: '€2–5 тис.', sent: false };
  }
  renderVals() {
    const picked = this.state.picked;
    const services = ['Брендинг', 'Ребрендинг', 'Поліграфія і друк', 'Упаковка', 'Вебдизайн', 'SMM'].map((l) => {
      const on = picked.indexOf(l) !== -1;
      return {
        label: l, on: on,
        bg: on ? '#FF7A2F' : 'transparent', fg: on ? '#140A08' : '#F5EFEA',
        toggle: () => this.setState({ picked: on ? picked.filter((x) => x !== l) : picked.concat([l]) })
      };
    });
    const budgets = ['до €1 тис.', '€1–2 тис.', '€2–5 тис.', '€5 тис.+'].map((l) => {
      const on = this.state.budget === l;
      return {
        label: l, on: on,
        bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0D0A0B' : '#F5EFEA',
        pick: () => this.setState({ budget: l })
      };
    });
    return {
      services: services,
      budgets: budgets,
      sent: this.state.sent,
      notSent: !this.state.sent,
      send: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
/* Site-only: send the contact form to the studio inbox via FormSubmit; fall back to the visitor's mail app. */
(function () {
  var TO = 'meet.red.panda@gmail.com';
  function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function mailtoFallback(lines) {
    var body = encodeURIComponent(lines.join('\n'));
    window.location.href = 'mailto:' + TO + '?subject=' + encodeURIComponent('Заявка з сайту Red Panda') + '&body=' + body;
  }
  var baseRender = Component.prototype.renderVals;
  Component.prototype.renderVals = function () {
    var self = this;
    var v = baseRender.call(this);
    v.send = function () {
      var contact = val('rp-email');
      var field = document.getElementById('rp-email');
      if (!contact) {
        if (field) { field.setAttribute('aria-invalid', 'true'); field.style.borderColor = '#FF4D8D'; field.focus(); }
        return;
      }
      var data = {
        'Ім’я': val('rp-name') || '—',
        'Email або телефон': contact,
        'Послуги': (self.state.picked || []).join(', ') || '—',
        'Бюджет': self.state.budget || '—',
        'Тираж': val('rp-run') || '—',
        'Задача': val('rp-msg') || '—',
        _subject: 'Нова заявка з сайту Red Panda',
        _template: 'table',
        _captcha: 'false'
      };
      if (contact.indexOf('@') > 0) data._replyto = contact;
      var lines = Object.keys(data).filter(function (k) { return k.charAt(0) !== '_'; }).map(function (k) { return k + ': ' + data[k]; });
      fetch('https://formsubmit.co/ajax/' + TO, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      }).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (res) {
