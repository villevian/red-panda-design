    if (node.nodeType === 3) { out.push(document.createTextNode(str(ctx, node.nodeValue))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName.toLowerCase();
    if (tag === 'sc-for') {
      var list = look(ctx, holeOf(node.getAttribute('list'))) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (it, i) {
        var c = Object.create(ctx); c[as] = it; c.$index = i;
        node.childNodes.forEach(function (ch) { proc(ch, c, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(ctx, holeOf(node.getAttribute('value')))) node.childNodes.forEach(function (ch) { proc(ch, ctx, out); });
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var m = a.value.match(WHOLE);
      if (/^on/i.test(a.name) && m) {
        var fn = look(ctx, m[1]);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      el.setAttribute(a.name, str(ctx, a.value));
    });
    var kids = [];
    node.childNodes.forEach(function (ch) { proc(ch, ctx, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  window.rpMount = function (C) {
    var tpl = document.getElementById('rp-tpl').content;
    var root = document.getElementById('rp-root');
    var comp = new C({});
    root.addEventListener('submit', function (e) { e.preventDefault(); });
    function render() {
      var saved = {};
      root.querySelectorAll('input[id], textarea[id]').forEach(function (e) { saved[e.id] = e.value; });
      var vals = comp.renderVals() || {};
      var out = [];
      tpl.childNodes.forEach(function (ch) { proc(ch, vals, out); });
      root.replaceChildren.apply(root, out);
      Object.keys(saved).forEach(function (id) { var e = document.getElementById(id); if (e) e.value = saved[id]; });
    }
    comp.__render = render;
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'packs', open: 0 };
  }
  renderVals() {
    const isPacks = this.state.mode === 'packs';
    const print = [
      { item: 'Візитки, 2 сторони', run: '500 шт', design: '€60', price: '€45' },
      { item: 'Флаєри А5', run: '1 000 шт', design: '€90', price: '€80' },
      { item: 'Буклет, 2 фальци', run: '500 шт', design: '€180', price: '€160' },
      { item: 'Меню для ресторану', run: '50 шт', design: '€250', price: '€120' },
      { item: 'Каталог, 24 сторінки', run: '300 шт', design: '€900', price: '€780' },
      { item: 'Етикетки на рулоні', run: '2 000 шт', design: '€200', price: '€140' },
      { item: 'Коробка з логотипом', run: '300 шт', design: '€350', price: 'за запитом' }
    ];
    const faqData = [
      { q: 'Ви самі друкуєте?', a: 'Ми робимо макети й готуємо файли до друку, а друкуємо в перевіреній партнерській друкарні. Самі погоджуємо пробний відбиток і перевіряємо тираж — для вас це одне замовлення.' },
      { q: 'Можна тільки надрукувати мій готовий макет?', a: 'Так. Перевіримо файл на помилки (вильоти, кольори, роздільність), за потреби виправимо й відправимо в друк.' },
      { q: 'Скільки триває проєкт?', a: 'Поліграфія — від кількох днів, брендинг і сайт — кілька тижнів. Точний графік з етапами ви отримаєте після брифу.' },
      { q: 'Як відбувається оплата?', a: 'Дизайн — частинами за етапами. Друк оплачується перед запуском тиражу.' },
      { q: 'Чи робите ви розробку сайту?', a: 'Ми фокусуємось на дизайні й працюємо з перевіреними розробниками. Можемо зібрати команду під ключ або передати макети вашим програмістам.' }
    ];
    const faq = faqData.map((d, i) => {
      const open = this.state.open === i;
      return Object.assign({}, d, {
        open: open,
        icon: open ? '−' : '+',
        iconBg: open ? '#FF7A2F' : 'transparent',
        iconFg: open ? '#0D0A0B' : '#F5EFEA',
        toggle: () => this.setState({ open: open ? -1 : i })
      });
    });
    return {
      isPacks: isPacks,
      isPrint: !isPacks,
      packsBg: isPacks ? '#FFFFFF' : 'transparent',
      packsFg: isPacks ? '#0D0A0B' : '#F5EFEA',
      printBg: isPacks ? 'transparent' : '#FFFFFF',
      printFg: isPacks ? '#F5EFEA' : '#0D0A0B',
      setPacks: () => this.setState({ mode: 'packs' }),
      setPrint: () => this.setState({ mode: 'print' }),
      print: print,
      faq: faq
    };
  }
}
rpMount(Component);
</script>
