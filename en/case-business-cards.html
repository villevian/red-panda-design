<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(44px, 6.6vw, 100px); line-height: 1; letter-spacing: -0.035em"><span class="rp-silver">Business cards for six</span><br><span class="rp-grad">Ligurian brands.</span></h1>
<p style="margin: 0; max-width: 760px; font-size: 19px; line-height: 1.65; color: #A89F99">A series of double-sided business cards for six real Italian businesses. For each one we picked a detail that tells you what they do: a dancer’s movement, a ceramicist’s brushstroke, the groove of a vinyl record. For the bookshop, the idea even changed the format — the card became a bookmark.</p>
</section>

<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -0.02em">Shaka Cocktail Bar</h2>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A89F99">Loano</span>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A89F99">Shaka is a cocktail bar in Loano where the evening aperitivo comes with focaccia and sharing boards.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #D7CCC6"><strong style="color: #F5EFEA">What we designed.</strong> The front shows a cocktail coupe with a long curl of citrus peel. The back holds the contact details and a QR code that opens the menu straight away.</p>
</div>
<div style="flex: 1.5 1 520px; min-width: 0"><img class="rp-shot" src="../assets/cards-shaka.jpg" alt="Shaka Cocktail Bar card: dark front with coupe and peel, pink back with menu QR code" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.5)"></div>
</section>
<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap-reverse; gap: 48px; align-items: center; border-top: 1px solid rgba(255,255,255,.10)">
<div style="flex: 1.5 1 520px; min-width: 0"><img class="rp-shot" src="../assets/cards-flow.jpg" alt="Lavender Flow Dance Studio card with a dancer in motion and a back with the classes QR code" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.5)"></div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span class="rp-grad" style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px">02</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -0.02em">Flow Dance Studio</h2>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A89F99">Loano</span>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A89F99">Flow is a dance studio for kids and adults, teaching modern, contemporary and hip hop, plus aerial hoop classes.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #D7CCC6"><strong style="color: #F5EFEA">What we designed.</strong> We broke a single dance move into several successive phases and placed them across the front of the card — a short fragment of choreography on paper. On the back, a QR code leads to the class descriptions.</p>
</div>
</section>
<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; border-top: 1px solid rgba(255,255,255,.10)">

<span class="rp-grad" style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px">03</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -0.02em">Libreria del Conte</h2>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A89F99">Loano</span>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A89F99">Libreria del Conte is a bookshop on Corso Roma, stocking fiction, crime novels, children’s books and art titles.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #D7CCC6"><strong style="color: #F5EFEA">What we designed.</strong> We created a narrow bookmark-style card. The navy front with the name set vertically recalls a book spine. On the cream back we left the fields <em>Titolo</em> and <em>Autore</em>, where the bookseller can write down the next book they recommend to the reader.</p>
</div>
<div style="flex: 1.5 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px"><img class="rp-shot" src="../assets/cards-delconte-cover.jpg" alt="Navy Libreria del Conte bookmark card with a red ribbon on an open book" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.5)"><img class="rp-shot" src="../assets/cards-delconte-detail.jpg" alt="Front and cream back of the bookmark with the Titolo and Autore fields" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.5)"></div>
</section>
<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap-reverse; gap: 48px; align-items: center; border-top: 1px solid rgba(255,255,255,.10)">

<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span class="rp-grad" style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px">04</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -0.02em">Ceramiche Mazzotti</h2>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A89F99">Albissola Marina</span>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A89F99">Ceramiche Mazzotti is a ceramics workshop in Albissola Marina. The makers shape and decorate every piece by hand, including custom orders.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #D7CCC6"><strong style="color: #F5EFEA">What we designed.</strong> We gave the card the shape of a square tile. On a white ground, a few broad cobalt brushstrokes paint a fish. On the back, next to the contacts, a small mark echoes a maker’s stamp on the base of a pot.</p>
</div>
</section>
<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; border-top: 1px solid rgba(255,255,255,.10)">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span class="rp-grad" style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px">05</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -0.02em">Disco Club</h2>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A89F99">Genoa</span>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A89F99">Disco Club is an independent record shop in Genoa, founded in 1965. People still come here for vinyl today.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #D7CCC6"><strong style="color: #F5EFEA">What we designed.</strong> We turned the square card into a miniature record sleeve. On the front, black vinyl grooves meet chunky lettering on a lime ground. The back is labelled <em>Lato B</em> — “side B” — and that’s exactly where the shop’s address lives.</p>
</div>
<div style="flex: 1.5 1 520px; min-width: 0"><img class="rp-shot" src="../assets/cards-discoclub.jpg" alt="Square lime Disco Club card with vinyl grooves and a black Lato B back with the address" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.5)"></div>
</section>
<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap-reverse; gap: 48px; align-items: center; border-top: 1px solid rgba(255,255,255,.10)">
<div style="flex: 1.5 1 520px; min-width: 0"><img class="rp-shot" src="../assets/cards-romanengo.jpg" alt="Lilac Romanengo card with scalloped edge and violets, and a cream back with an oval frame" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.5)"></div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span class="rp-grad" style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px">06</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -0.02em">Romanengo</h2>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A89F99">Genoa</span>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #A89F99">Romanengo is a historic Genoese confectioner whose story goes back to the 18th century. Its traditional products include candied fruit, chocolate and sugared almonds. For this concept we chose the shop on Via Soziglia.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #D7CCC6"><strong style="color: #F5EFEA">What we designed.</strong> We imagined the card as something you’d be glad to find in a box of sweets. The scalloped edge recalls a paper sweet wrapper, and two violets bloom above the name on a lilac ground. On the cream back, a thin oval frame brings together the shop name, address and website.</p>
</div>
</section>

<p style="margin: 0; font-size: 14px; color: #A89F99; border-top: 1px solid rgba(255,255,255,.10); padding-top: 24px">Study concepts by Red Panda Design, created for our portfolio. These businesses did not commission the cards.</p>

      root.replaceChildren.apply(root, out);
      Object.keys(saved).forEach(function (id) { var e = document.getElementById(id); if (e) e.value = saved[id]; });
    }
    comp.__render = render;
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();
