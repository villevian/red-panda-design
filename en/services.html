<script>
/* Tiny renderer for the page template: {{holes}}, <sc-for>, <sc-if>, onClick handlers. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  }
  forceUpdate() { if (this.__render) this.__render(); }
}
(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function look(ctx, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = ctx, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function str(ctx, s) {
    return s.replace(HOLE, function (m, p) { var v = look(ctx, p); return v == null ? '' : String(v); });
  }
  function holeOf(s) { var m = (s || '').match(WHOLE); return m ? m[1] : (s || ''); }
  function proc(node, ctx, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(str(ctx, node.nodeValue))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName.toLowerCase();
    if (tag === 'sc-for') {
      var list = look(ctx, holeOf(node.getAttribute('list'))) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (it, i) {
        var c = Object.create(ctx); c[as] = it; c.$index = i;
        node.childNodes.forEach(function (ch) { proc(ch, c, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(ctx, holeOf(node.getAttribute('value')))) node.childNodes.forEach(function (ch) { proc(ch, ctx, out); });
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var m = a.value.match(WHOLE);
      if (/^on/i.test(a.name) && m) {
        var fn = look(ctx, m[1]);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      el.setAttribute(a.name, str(ctx, a.value));
    });
    var kids = [];
    node.childNodes.forEach(function (ch) { proc(ch, ctx, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  window.rpMount = function (C) {
    var tpl = document.getElementById('rp-tpl').content;
    var root = document.getElementById('rp-root');
    var comp = new C({});
    root.addEventListener('submit', function (e) { e.preventDefault(); });
    function render() {
      var saved = {};
      root.querySelectorAll('input[id], textarea[id]').forEach(function (e) { saved[e.id] = e.value; });
      var vals = comp.renderVals() || {};
      var out = [];
      tpl.childNodes.forEach(function (ch) { proc(ch, vals, out); });
      root.replaceChildren.apply(root, out);
      Object.keys(saved).forEach(function (id) { var e = document.getElementById(id); if (e) e.value = saved[id]; });
    }
    comp.__render = render;
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 0 };
  }
  renderVals() {
    const data = [
      { title: 'Brand creation', short: 'A brand from scratch: what you say, how you look and what sets you apart.', price: 'from €1,900', items: ['Strategy, positioning, tone of voice', 'Naming and tagline (if needed)', 'Logo, colours, fonts, graphics', 'Brand book in PDF and Figma'] },
      { title: 'Rebranding', short: 'We refresh a brand that has aged without losing the customers who already know you.', price: 'from €2,800', items: ['Audit of your current brand', 'New or refreshed identity', 'Transition plan: what to change and when', 'Updated touchpoints: signage, documents, social media'] },
      { title: 'Print & production', short: 'Custom design and a finished run from a partner print shop.', price: 'from €150 + printing', items: ['Business cards, postcards, flyers, posters', 'Leaflets, catalogues, menus, brochures', 'Prepress and paper selection', 'Proof, print-run quality control, delivery'] },
      { title: 'Packaging and labels', short: 'Packaging that stands out on the shelf and makes people want to take a photo.', price: 'from €900', items: ['Design of boxes, bags and labels', 'Dielines and technical files', 'Printing of small and large runs', 'Branded merch: T-shirts, stickers, tote bags'] },
      { title: 'Web design', short: 'Websites in the same style as your print: landing pages, company sites, online shops.', price: 'from €2,600', items: ['Page structure and prototype', 'Design for desktop and mobile', 'UI kit in Figma', 'Development support through launch'] },
      { title: 'Social media and presentations', short: 'Templates for social media and presentations, so your team stays on brand.', price: 'from €600', items: ['Post and story templates', 'Covers and banners', 'Company presentation', 'Guide for your team'] }
    ];
    const services = data.map((d, i) => {
      const open = this.state.open === i;
      return Object.assign({}, d, {
        num: String(i + 1).padStart(2, '0'),
        open: open,
        icon: open ? '−' : '+',
        iconBg: open ? '#FF7A2F' : 'transparent',
        iconFg: open ? '#0D0A0B' : '#F5EFEA',
        toggle: () => this.setState({ open: open ? -1 : i })
      });
    });
    return { services: services };
  }
}

rpMount(Component);
</script>
